<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook — Cybernaut Annie</title>

<!----y2k fonts---->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="guestbook.css">
  <link rel="icon" type="image/png" href="cybernaut.png">
</head>
<body>
  <!---star rating, top right--->
  <div class="guestbook-rating">
    <div class="rating">
      <input value="5" name="rate" id="star5" type="radio">
      <label title="text" for="star5"></label>
      <input value="4" name="rate" id="star4" type="radio">
      <label title="text" for="star4"></label>
      <input value="3" name="rate" id="star3" type="radio" checked="">
      <label title="text" for="star3"></label>
      <input value="2" name="rate" id="star2" type="radio">
      <label title="text" for="star2"></label>
      <input value="1" name="rate" id="star1" type="radio">
      <label title="text" for="star1"></label>
    </div>
  </div>
    <!---glowing heart--->
  <div class="guestbook-heart" id="glowing-heart"></div>
  <!---Guestbook window--->
  <div class="os-window" id="guestbook">
    <div class="os-titlebar">
      <span class="os-titlebar-label">📖GUESTBOOK.exe</span>
      <div class="os-controls">
        <button>_</button>
        <button>▢</button>
        <button>X</button>
      </div>
    </div>
    <div class="os-body">
      <p>leave your mark</p>
      <div class="guestbook-inner">
        <div class="guestbook-entries" id="guestbook-entries"></div>
        <div class="guestbook-inputrow">
          <input type="text" class="guestbook-input" placeholder="type a message..." maxlength="200">
          <button class="guestbook-send">SEND</button>
        </div>
      </div>
    </div>
  </div>

  <!---taskbar navigation--->
  <div class="taskbar">
    <a class="start-button" href="index.html">START</a>
    <a class="taskbar-tab" href="about.html">About Me</a>
    <a class="taskbar-tab" href="research.html">Research</a>
    <a class="taskbar-tab" href="gallery.html">Gallery</a>
    <a class="taskbar-tab" href="guestbook.html">Guestbook</a>
  </div>
<script src="heart.js"></script>
<script src="guestbook.js"></script>
</body>
</html>
