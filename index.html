<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernaught Annie</title>

  <!-- y2k fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <article style="--rot: 1" class="sphere sphere2">…same items…</article>
        <article style="--rot: 2" class="sphere sphere3">…same items…</article>
        <article style="--rot: 3" class="sphere sphere4">…same items…</article>
        <article style="--rot: 4" class="sphere sphere5">…same items…</article>
        <article style="--rot: 5" class="sphere sphere6">…same items…</article>
        <article style="--rot: 6" class="sphere sphere7">…same items…</article>
        <article style="--rot: 7" class="sphere sphere8">…same items…</article>

      </section>
    </section>
  </div>
