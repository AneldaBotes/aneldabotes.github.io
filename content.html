<script>
  // Aesthetic Atlas coin: gold flash on press, the link itself opens the new tab
  (function () {
    var coin = document.querySelector('.atlas-coin');
    if (!coin) return;
    function flash() {
      coin.classList.remove('launching');
      void coin.offsetWidth;
      coin.classList.add('launching');
    }
    coin.addEventListener('pointerdown', flash);
    coin.addEventListener('keydown', function (e) { if (e.key === 'Enter') flash(); });
    coin.addEventListener('animationend', function (e) {
      if (e.animationName === 'coin-flash') coin.classList.remove('launching');
    });
  })();
</script>
