<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernaut Annie</title>

<!----y2k fonts---->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!---happy or sad button--->
  <div class="corner-container">
    <label class="main-toggle">
      <input class="main-checkbox" type="checkbox" />
      <div class="main-track"></div>
      <div class="main-knob"></div>
    </label>
  </div>

  <h1>Digital Ghost</h1>
  <p>Loving awareness - soft in the machine - collecting pixels</p>

  <!---nokia spin--->
  <div class="nokia-stage">
    <img src="nokia.png" alt="Nokia phone" class="nokia-spin">
  </div>
  
  <!-- Fairy dust cursor trail -->
  <script>
    (function () {
      var sparkleColors = ['#ff1ab3', '#ff6fd8', '#00ffff', '#ffffff'];
      var lastSpawn = 0;
      var throttleMs = 40;

      function spawnSparkle(x, y) {
        var sparkle = document.createElement('div');
        sparkle.className = 'fairy-sparkle';

        var size = Math.random() * 8 + 5;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
        sparkle.style.left = (x + (Math.random() * 12 - 6)) + 'px';
        sparkle.style.top = (y + (Math.random() * 12 - 6)) + 'px';
        sparkle.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
        sparkle.style.setProperty('--drift', (Math.random() * 24 - 12) + 'px');

        document.body.appendChild(sparkle);

        window.setTimeout(function () {
          sparkle.remove();
        }, 750);
      }

      document.addEventListener('mousemove', function (e) {
        var now = Date.now();
        if (now - lastSpawn < throttleMs) return;
        lastSpawn = now;
        spawnSparkle(e.clientX, e.clientY);
      });
    })();
  </script>

  
<!---me follow scroll--->
   <img src="PixiePose.png" alt="Self portrait" class="self-portrait">

</body>
</html>
