<script>
  // Aesthetic Atlas coin: gold flash on press, the link itself opens the new tab
  (function () {
    var coin = document.querySelector('.atlas-coin');
    if (!coin) return;
    function flash() {
      coin.classList.remove('launching');
      void coin.offsetWidth;
      coin.classList.add('launching');
    }
    coin.addEventListener('pointerdown', flash);
    coin.addEventListener('keydown', function (e) { if (e.key === 'Enter') flash(); });
    coin.addEventListener('animationend', function (e) {
      if (e.animationName === 'coin-flash') coin.classList.remove('launching');
    });
  })();
</script>
<script>
  // Scale of Everything token: nested rainbow rings that zoom on hover,
  // and on click grow to fill the screen before the page opens (same tab)
  (function () {
    var link = document.querySelector('.scale-token');
    if (!link) return;
    var cv = link.querySelector('canvas'), ctx = cv.getContext('2d');
    var HUES = [275, 232, 195, 140, 75, 22, 340]; // same colours as the favicon
    var RATIO = 0.62, TAU = Math.PI * 2;
    var DX = Math.cos(-0.405), DY = Math.sin(-0.405); // rings nest toward the upper right
    var FALL_SECONDS = 1.4;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var z = 0, hover = false, last = performance.now(), overlay = null;

    function mod(a, n) { return ((a % n) + n) % n; }

    // draws the nested rings; (vx, vy) is the point they shrink toward, z is how deep you are
    function rings(c, vx, vy, R0, zz, maxR, alpha) {
      var n0 = Math.floor(zz), s = zz - n0;
      for (var k = 0; k < 40; k++) {
        var R = R0 * Math.pow(RATIO, k - s);
        if (R < 0.6) break;
        if (R > maxR) continue;
        c.lineWidth = Math.max(0.8, R * 0.085);
        c.strokeStyle = 'hsla(' + HUES[mod(k + n0, 7)] + ',85%,68%,' + (alpha * Math.min(1, R / 3)) + ')';
        c.beginPath();
        c.arc(vx - 0.8 * R * DX, vy - 0.8 * R * DY, R, 0, TAU);
        c.stroke();
      }
    }

    function drawToken() {
      var w = link.clientWidth, r = w / 2;
      var px = Math.round(w * Math.min(2, window.devicePixelRatio || 1));
      if (cv.width !== px) { cv.width = px; cv.height = px; }
      ctx.setTransform(px / w, 0, 0, px / w, 0, 0);
      ctx.clearRect(0, 0, w, w);
      ctx.save();
      ctx.beginPath(); ctx.arc(r, r, r, 0, TAU); ctx.clip();
      ctx.fillStyle = '#07060f'; ctx.fillRect(0, 0, w, w);
      rings(ctx, r + 0.733 * r * DX, r + 0.733 * r * DY, 0.917 * r, z, w * 4, 1);
      ctx.restore();
    }

    function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!overlay) {
        if (!reduce) z += dt * (hover ? 0.7 : 0.05);
        drawToken();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    link.addEventListener('pointerenter', function () { hover = true; });
    link.addEventListener('pointerleave', function () { hover = false; });
    link.addEventListener('focus', function () { hover = true; });
    link.addEventListener('blur', function () { hover = false; });

    function fallIn(url) {
      var rect = link.getBoundingClientRect(), r = rect.width / 2;
      var W = window.innerWidth, H = window.innerHeight, d = Math.min(2, window.devicePixelRatio || 1);
      overlay = document.createElement('canvas');
      overlay.className = 'scale-fall';
      overlay.width = Math.round(W * d);
      overlay.height = Math.round(H * d);
      document.body.appendChild(overlay);
      link.style.visibility = 'hidden';

      var c = overlay.getContext('2d');
      var cx0 = rect.left + r, cy0 = rect.top + r;
      var vx0 = cx0 + 0.733 * r * DX, vy0 = cy0 + 0.733 * r * DY;
      var diag = Math.hypot(W, H), maxGrow = (diag * 3) / (0.917 * r);
      var zz = z, start = performance.now();

      function step(now) {
        var p = Math.min(1, (now - start) / 1000 / FALL_SECONDS);
        var grow = Math.exp(p * p * p * Math.log(maxGrow)); // slow at first, then rushing in
        var m = p * p * (3 - 2 * p);                         // drift toward the screen centre
        var vx = vx0 + (W / 2 - vx0) * m, vy = vy0 + (H / 2 - vy0) * m;
        c.setTransform(d, 0, 0, d, 0, 0);
        c.clearRect(0, 0, W, H);
        c.save();
        c.beginPath();
        c.arc(vx + (cx0 - vx0) * grow, vy + (cy0 - vy0) * grow, r * grow, 0, TAU);
        c.fillStyle = '#07060f'; c.fill(); c.clip();
        rings(c, vx, vy, 0.917 * r * grow, zz, diag * 3, 1 - 0.7 * Math.max(0, (p - 0.75) / 0.25));
        c.restore();
        if (p > 0.8) { c.fillStyle = 'rgba(7,6,15,' + ((p - 0.8) / 0.2) + ')'; c.fillRect(0, 0, W, H); }
        if (p < 1) requestAnimationFrame(step);
        else window.location.href = url;
      }
      requestAnimationFrame(step);
    }

    link.addEventListener('click', function (e) {
      if (overlay) { e.preventDefault(); return; }
      // ctrl/cmd-click still opens a new tab the normal way; reduced motion skips the fall
      if (reduce || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      fallIn(link.href);
    });

    // coming back with the browser's back button: clear the dark screen
    window.addEventListener('pageshow', function () {
      if (overlay) { overlay.remove(); overlay = null; }
      link.style.visibility = '';
    });
  })();
</script>
