<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Runner</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#3f6;font-family:"Courier New",monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(100vw,calc(100vh - 20px),620px);aspect-ratio:1;background:#000;outline:none}
#pad{display:none;width:min(100vw,620px);justify-content:space-between;padding:10px;box-sizing:border-box}
#pad div{display:flex;gap:10px}
#pad button{width:min(72px,19vw);height:60px;font:bold 18px "Courier New",monospace;color:#3f6;background:#02150b;border:2px solid #3f6;border-radius:4px;touch-action:none}
#pad button:active{background:#0a4}
@media (pointer:coarse){#pad{display:flex}canvas{width:min(100vw,calc(100vh - 90px))}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Neon Runner racing game"></canvas>
<div id="pad">
  <div><button data-k="L">&lt;</button><button data-k="R">&gt;</button></div>
  <div><button data-k="B">BRK</button><button data-k="G">GAS</button></div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=250,HZ=112,RB=190,LAP=7000,LAPS=3,C=50;
const S=3;cv.width=cv.height=W*S;g.scale(S,S);g.imageSmoothingEnabled=false;
const R=(x,y,w,h)=>g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const keys={};let state='title',best=null;
try{best=parseFloat(localStorage.getItem('neonBest'))||null}catch(e){}

addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(state!=='play'&&(e.code==='Space'||e.code==='Enter'))start();
});
addEventListener('keyup',e=>keys[e.code]=0);
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(state!=='play')start()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=0}));
});
cv.addEventListener('pointerdown',()=>{if(state!=='play')start()});

// Skyline, drawn once
const sk=document.createElement('canvas');sk.width=500;sk.height=HZ;
(function(){
  const s=sk.getContext('2d');let seed=7;
  const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const pal=['#0a5','#0b7','#087','#3fa','#0c9'];
  for(let x=0;x<500;){
    const w=8+(rnd()*18|0),h=15+(rnd()*62|0),col=pal[rnd()*5|0];
    s.fillStyle='#021a12';s.fillRect(x,HZ-h,w,h);
    s.fillStyle=col;
    for(let y=HZ-h+3;y<HZ-2;y+=3)for(let xx=x+1;xx<x+w-1;xx+=3)if(rnd()<.4)s.fillRect(xx,y,1,1);
    const r=rnd();
    if(r<.22){s.fillStyle='#f4a';s.fillRect(x+(w>>1),HZ-h-6,1,6);s.fillRect(x+(w>>1)-1,HZ-h-7,3,1)}
    else if(r<.34){s.fillStyle='#4ff';s.fillRect(x,HZ-h,w,1)}
    x+=w+(rnd()*3|0);
  }
})();

const curve=s=>Math.sin(s/700)*.9+Math.sin(s/290)*.5;
const fmt=t=>{t=Math.max(0,t);const p=n=>String(n).padStart(2,'0');
  return p(Math.floor(t/60))+"'"+p(Math.floor(t%60))+'"'+Math.floor((t*10)%10)};

let pos,px,speed,hd,cars,laps,lapT,total,power,inv,lapNo;
const colors=['#f4a','#44f','#4cf','#fa3','#a4f'];
function mkCar(i){return{x:(Math.random()*1.4-.7),wz:pos+120+i*70+Math.random()*60,sp:70+Math.random()*80,col:colors[i%colors.length]}}
function reset(){
  pos=0;px=0;speed=0;hd=0;laps=[];lapT=0;total=0;power=100;inv=0;lapNo=0;
  cars=[];for(let i=0;i<3;i++)cars.push(mkCar(i));
}
reset();
function start(){reset();state='play'}

function update(dt){
  if(state!=='play'){pos+=50*dt;hd+=curve(pos)*dt*20;return}
  const L=keys.ArrowLeft||keys.KeyA||keys.L,Rt=keys.ArrowRight||keys.KeyD||keys.R;
  const acc=keys.ArrowUp||keys.KeyW||keys.G,br=keys.ArrowDown||keys.KeyS||keys.B;
  speed+=(acc?90:-30)*dt;if(br)speed-=170*dt;
  const max=Math.abs(px)>1.05?80:250;
  if(speed>max)speed=Math.max(max,speed-220*dt);
  speed=clamp(speed,0,250);
  const f=speed/250;
  px+=((Rt?1:0)-(L?1:0))*dt*1.9*f;
  px-=curve(pos)*f*f*dt*.9;
  px=clamp(px,-1.7,1.7);
  pos+=speed*dt;hd+=curve(pos)*f*dt*30;
  total+=dt;lapT+=dt;inv=Math.max(0,inv-dt);
  const ln=Math.floor(pos/LAP);
  if(ln>lapNo){laps.push(lapT);lapT=0;lapNo=ln;
    if(laps.length>=LAPS){state='done';
      if(!best||total<best){best=total;try{localStorage.setItem('neonBest',best)}catch(e){}}}}
  for(const c of cars){
    c.wz+=c.sp*dt;
    const dz=c.wz-pos;
    if(dz<-30){c.x=Math.random()*1.4-.7;c.wz=pos+300+Math.random()*250;c.sp=70+Math.random()*80}
    if(inv===0&&dz>6&&dz<22&&Math.abs(c.x-px)<.3){
      power-=20;speed*=.35;inv=1.2;c.wz+=50;
      if(power<=0){power=0;state='over'}
    }
  }
}

function draw(){
  g.fillStyle='#000';g.fillRect(0,0,W,W);
  const sx=((hd%500)+500)%500;
  g.drawImage(sk,-sx,0);g.drawImage(sk,500-sx,0);
  g.fillStyle='#0f6';R(0,HZ,W,1);
  // road rows
  const off=new Array(RB+2).fill(0);let a=0;
  for(let y=RB;y>HZ;y--){
    const t=(y-HZ)/(RB-HZ),dz=C/t-C;
    a+=curve(pos+dz)*.6;off[y]=a;
  }
  for(let y=HZ+1;y<=RB;y++){
    const t=(y-HZ)/(RB-HZ),dz=C/t-C,w=pos+dz;
    const half=t*125+1,cx=W/2-px*half+off[y];
    const band=Math.floor(w/14)%2;
    g.fillStyle=band?'#00170c':'#000d06';R(0,y,W,1);
    g.fillStyle=band?'#0e1a14':'#12261c';R(cx-half,y,half*2,1);
    const e=Math.max(1,t*7);
    g.fillStyle=Math.floor(w/20)%2?'#0f6':'#f0a';
    R(cx-half-e,y,e,1);R(cx+half,y,e,1);
    if(Math.floor(w/24)%2){
      g.fillStyle='#3f6';const lw=Math.max(1,t*3);
      R(cx-half*.33-lw/2,y,lw,1);R(cx+half*.33-lw/2,y,lw,1);
    }
  }
  // traffic, far to near
  const vis=cars.map(c=>({c,dz:c.wz-pos})).filter(o=>o.dz>-8&&o.dz<500).sort((p,q)=>q.dz-p.dz);
  for(const {c,dz} of vis){
    const t=C/(dz+C),y=HZ+t*(RB-HZ),half=t*125+1;
    const cx=W/2-px*half+off[Math.min(RB,Math.round(y))]+c.x*half;
    drawCar(cx,y,t*38,c.col);
  }
  // player
  if(!(inv>0&&Math.floor(inv*10)%2))drawCar(W/2,RB-3+(speed>5?Math.round(Math.random()):0),32,'#e22',true);
  hud();
  if(state==='title')overlay('NEON RUNNER',['3 LAPS. DODGE TRAFFIC.','ARROWS / WASD, OR TOUCH PAD','','PRESS SPACE OR TAP TO START'],best);
  if(state==='over')overlay('POWER DOWN',['LAPS DONE: '+laps.length+'/'+LAPS,'','SPACE OR TAP TO RETRY'],best);
  if(state==='done')overlay('FINISH',['TIME '+fmt(total),best&&total<=best?'NEW BEST!':'','SPACE OR TAP TO RACE AGAIN'],best);
}

function drawCar(cx,by,w,col,pl){
  if(w<2)return;
  const h=w*.5,x=cx-w/2,y=by-h;
  g.fillStyle='#000';R(x-1,by-h*.12,w+2,h*.14+1);
  g.fillStyle=col;R(x,y+h*.38,w,h*.52);R(x+w*.14,y,w*.72,h*.42);
  g.fillStyle='#120008';R(x+w*.22,y+h*.08,w*.56,h*.26);
  g.fillStyle=pl?'#fff':'#ff5';R(x+w*.04,y+h*.5,w*.22,h*.14);R(x+w*.74,y+h*.5,w*.22,h*.14);
  g.fillStyle='#111';R(x-w*.03,y+h*.72,w*.16,h*.28);R(x+w*.87,y+h*.72,w*.16,h*.28);
}

function txt(s,x,y,size,col,al){g.font='bold '+size+'px "Courier New",monospace';g.fillStyle=col;g.textAlign=al||'left';g.fillText(s,x,y)}

function hud(){
  g.fillStyle='#02150b';g.fillRect(0,RB+2,W,W-RB);
  g.fillStyle='#3f6';R(0,RB+2,W,2);
  g.strokeStyle='#0a4';g.lineWidth=1;g.strokeRect(6.5,RB+10.5,100,48);
  for(let i=0;i<LAPS;i++){
    const t=i<laps.length?laps[i]:(i===laps.length&&state==='play'?lapT:0);
    txt('LAP'+(i+1),12,RB+24+i*14,10,'#fb3');txt(fmt(t),52,RB+24+i*14,10,'#fb3');
  }
  txt(String(Math.round(speed*.9)),170,RB+34,24,'#3f6','right');
  txt('MPH',174,RB+34,10,'#3f6');
  g.fillStyle='#0a4';R(118,RB+14,70,3);
  g.fillStyle='#3f6';R(118,RB+14,70*speed/250,3);
  txt('TIME',116,RB+52,9,'#021',  'left');
  g.fillStyle='#3f6';R(114,RB+43,28,11);txt('TIME',116,RB+52,9,'#021');
  txt(fmt(total),148,RB+52,10,'#3f6');
  g.strokeStyle='#3f6';g.strokeRect(209.5,RB+8.5,28,36);
  const n=Math.round(power/10);
  for(let i=0;i<10;i++){g.fillStyle=i<n?(power<30?'#f33':'#3f6'):'#0a3';R(213,RB+12+(9-i)*3.2,20,2)}
  txt('POWER',223,RB+54,8,'#3f6','center');
}

function overlay(title,lines,b){
  g.fillStyle='rgba(0,0,0,.88)';g.fillRect(20,50,210,110);
  g.strokeStyle='#f0a';g.strokeRect(20.5,50.5,209,109);
  txt(title,125,78,18,'#f4a','center');
  lines.forEach((l,i)=>txt(l,125,96+i*13,10,'#3f6','center'));
  if(b)txt('BEST '+fmt(b),125,153,10,'#4ff','center');
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
