body { font-family: sans-serif; margin: 20px; background: #fff; color: #000; }
#box { --size: 120px; width: 100%; min-height: 560px; font-family: "Cybersigil", sans-serif; font-size: var(--size); line-height: 1.3; border: 2px solid #000; padding: 0 10px 0 70px; box-sizing: border-box; background-color: #fff;
  background-image:
    linear-gradient(to right, transparent 54px, #e57373 54px, #e57373 56px, transparent 56px),
    linear-gradient(to bottom, transparent calc(var(--size) * 0.95 - 1px), #7ea6d9 calc(var(--size) * 0.95 - 1px), #7ea6d9 calc(var(--size) * 0.95 + 1px), transparent calc(var(--size) * 0.95 + 1px)),
    linear-gradient(to bottom, transparent calc(var(--size) * 0.25 - 1px), #5fb878 calc(var(--size) * 0.25 - 1px), #5fb878 calc(var(--size) * 0.25 + 1px), transparent calc(var(--size) * 0.25 + 1px));
  background-size: 100% 100%, 100% calc(var(--size) * 1.3), 100% calc(var(--size) * 1.3);
  background-repeat: no-repeat, repeat-y, repeat-y;
  background-origin: padding-box; }
label { display: block; margin: 16px 0 6px; }
</style></head><body>
<h2>Type here (A to Z and space work so far)</h2>
<p style="margin:0 0 10px"><span style="color:#5fb878">Green line</span> = top of letters. <span style="color:#7ea6d9">Blue line</span> = bottom (baseline).</p>
<div id="box" contenteditable="true">ABCDEFGHIJKLM NOPQRSTUVWXYZ</div>
<label>Size: <input id="size" type="range" min="20" max="300" value="120"></label>
<script>
document.getElementById("size").oninput = function() { document.getElementById("box").style.setProperty("--size", this.value + "px"); };
</script>
</body></html>
