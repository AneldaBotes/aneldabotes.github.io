<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscope Orb</title>

  <!-- Retro fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Digital Ghost</h1>
  <p>Loving awareness - soft in the machine - collecting pixels</p>

  <!-- Orb background -->
  <div class="orb-background">
    <section class="container">
      <section class="loader">
        <!-- 12 triangular facets -->
        <div class="facet" style="--rot-x:0; --rot-y:0; --color:#ff0000;"></div>
        <div class="facet" style="--rot-x:0; --rot-y:60; --color:#ff7f00;"></div>
        <div class="facet" style="--rot-x:0; --rot-y:120; --color:#ffff00;"></div>
        <div class="facet" style="--rot-x:0; --rot-y:180; --color:#00ff00;"></div>
        <div class="facet" style="--rot-x:0; --rot-y:240; --color:#0000ff;"></div>
        <div class="facet" style="--rot-x:0; --rot-y:300; --color:#8b00ff;"></div>

        <div class="facet" style="--rot-x:60; --rot-y:30; --color:#ff1493;"></div>
        <div class="facet" style="--rot-x:60; --rot-y:90; --color:#00ced1;"></div>
        <div class="facet" style="--rot-x:60; --rot-y:150; --color:#ffa500;"></div>
        <div class="facet" style="--rot-x:60; --rot-y:210; --color:#7fff00;"></div>
        <div class="facet" style="--rot-x:60; --rot-y:270; --color:#1e90ff;"></div>
        <div class="facet" style="--rot-x:60; --rot-y:330; --color:#ff69b4;"></div>
      </section>
    </section>
  </div>
</body>
</html>
